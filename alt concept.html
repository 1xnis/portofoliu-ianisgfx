<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ianisgfx — preview portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Manrope:wght@200;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.webp">
  <style>
    /* Preview: stilul de animație „portal” adaptat pe ianisgfx. Lichidul din bg.js e lumea din spatele ferestrei. */
    :root { --bg: #0e0a0a; --fg: #f5ede6; --muted: #9a8c86; --accent: #ff4f45; --pad: clamp(18px, 1.95vw, 28px);
            --ease: cubic-bezier(.22, 1, .36, 1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
                 font: 400 16px/1.4 Manrope, Arial, sans-serif; }
    .experience { position: relative; width: 100%; height: 100%; min-height: 540px; overflow: hidden; }
    .bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
          filter: hue-rotate(0deg) saturate(1) brightness(1); }
    /* voalul întunecă tot în afară de fereastră (gaura e desenată din JS cu clip-path) */
    .veil { position: fixed; inset: 0; z-index: 1; background: #0a0707; opacity: .55; pointer-events: none; }
    .outline { position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; }
    .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
             background: linear-gradient(to bottom, transparent 52%, rgba(8, 5, 5, .88) 100%); }

    .chrome { position: absolute; z-index: 4; transition: opacity .45s ease, filter .45s ease; }
    .is-transitioning .chrome { opacity: 0; filter: blur(8px); pointer-events: none; }
    .is-transitioning .header, .is-transitioning .list { opacity: 1; filter: none; pointer-events: auto; }

    /* Preloader: contor subțire jos, logo-ul plutește în centru și apoi zboară în header */
    .count { position: fixed; z-index: 22; left: 50%; bottom: clamp(22px, 3.1vh, 28px); display: flex; align-items: flex-end;
             gap: 4px; transform: translateX(-50%); line-height: 1; }
    .count b { font-weight: 200; font-size: 64px; font-variant-numeric: tabular-nums; }
    .count i { font-style: normal; font-size: 24px; padding-bottom: 4px; }
    .count.is-leaving { animation: count-out .75s var(--ease) both; }
    @keyframes count-out { to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); } }
    .logo { position: fixed; z-index: 22; left: 50%; top: 50%; width: min(240px, 46vw); height: auto; transform: translate(-50%, -50%);
            transition: left 2s cubic-bezier(.16, 1, .3, 1), top 2s cubic-bezier(.16, 1, .3, 1),
                        width 2s cubic-bezier(.16, 1, .3, 1), transform 2s cubic-bezier(.16, 1, .3, 1); }
    .logo.is-docked { left: var(--pad); top: var(--pad); width: 82px; transform: none; }

    .header { left: var(--pad); right: var(--pad); top: var(--pad); display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
    .nav { display: flex; align-items: center; height: 42px; padding: 4px 5px; border: 1px solid rgba(255, 255, 255, .3);
           background: rgba(255, 255, 255, .06); backdrop-filter: blur(12px); border-radius: 999px; }
    .nav a { color: var(--fg); text-decoration: none; padding: 8px 19px; border-radius: 999px; line-height: 1; font-size: 14px; }
    .nav a.active { background: var(--fg); color: #000; }
    .cta { height: 42px; padding: 0 20px; display: grid; place-items: center; border-radius: 999px; background: var(--accent);
           color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }

    .list { left: var(--pad); top: 50%; transform: translateY(-43%); display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
    .item { display: flex; align-items: center; min-height: 20px; }
    .item.active { color: var(--fg); font-size: 18px; font-weight: 700; gap: 8px; }
    .item.active::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }

    .portal-wrap { left: 50%; top: 50%; width: min(300px, 28vw); transform: translate(-50%, -54%); }
    .portal-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; color: var(--muted); opacity: 0; }
    .portal-heading strong { color: var(--fg); font-size: 18px; margin-left: 8px; }
    .portal { display: block; width: 100%; aspect-ratio: 320 / 350; padding: 0; border: 0; background: transparent; cursor: pointer; }

    .content { left: clamp(28px, 4vw, 58px); right: clamp(28px, 3vw, 44px); bottom: clamp(24px, 3vh, 30px);
               display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
    .content h1 { flex: none; margin: 0 0 -.06em; font: 800 clamp(90px, 15vw, 240px)/.8 Syne, sans-serif;
                  letter-spacing: -.04em; text-transform: uppercase; white-space: nowrap; opacity: 0; }
    .content dl { flex: none; width: min(420px, 32vw); margin: 0; font-size: 15px; }
    .fact { display: grid; grid-template-columns: 120px 1fr; gap: 18px; padding: 8px 0; border-bottom: 1px solid rgba(245, 237, 230, .3); opacity: 0; }
    .fact:last-child { border-bottom: 0; }
    .fact dt { font-weight: 700; } .fact dd { margin: 0; color: var(--muted); }

    /* intrări */
    body:not(.intro-ready) .header, body:not(.intro-ready) .list { opacity: 0; }
    .intro-ready .header { animation: reveal-down .9s var(--ease) .1s both; }
    .intro-ready .list { animation: reveal-side .9s var(--ease) .65s both; }
    .content-revealing h1 { animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both; }
    .content-revealing .fact { animation: fact-rise .72s var(--ease) both; }
    .content-revealing .fact:nth-child(1) { animation-delay: .52s; } .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; } .content-revealing .fact:nth-child(4) { animation-delay: 1s; }
    .mask-revealing .portal-heading { animation: caption .85s var(--ease) both; }
    .list.is-switching .item { animation: row .58s var(--ease) both; }
    .list.is-switching .item.active::before { animation: dot .55s var(--ease) .18s both; }
    .list.is-switching .item:nth-child(2) { animation-delay: .05s; } .list.is-switching .item:nth-child(3) { animation-delay: .08s; }
    .list.is-switching .item:nth-child(4) { animation-delay: .11s; } .list.is-switching .item:nth-child(5) { animation-delay: .14s; }
    @keyframes reveal-down { from { opacity: 0; filter: blur(8px); transform: translateY(-18px); } to { opacity: 1; filter: blur(0); transform: none; } }
    @keyframes reveal-side { from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); } to { opacity: 1; filter: blur(0); transform: translate(0, -43%); } }
    @keyframes title-rise { from { opacity: 0; filter: blur(12px); transform: translateY(42px); } to { opacity: 1; filter: blur(0); transform: none; } }
    @keyframes fact-rise { from { opacity: 0; filter: blur(7px); transform: translateY(18px); } to { opacity: 1; filter: blur(0); transform: none; } }
    @keyframes caption { from { opacity: 0; filter: blur(7px); transform: translateY(22px); } to { opacity: 1; filter: blur(0); transform: none; } }
    @keyframes row { from { opacity: .35; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(280px, 44vw); }
      .content dl { width: 43vw; } .fact { grid-template-columns: 100px 1fr; }
    }
    @media (max-width: 640px) {
      .list { display: none; }
      .portal-wrap { top: 40%; width: min(240px, 62vw); }
      .content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .content h1 { margin-bottom: 16px; }
      .content dl { width: 100%; font-size: 13px; } .fact { grid-template-columns: 90px 1fr; padding: 5px 0; }
    }
  </style>
</head>
<body>
  <main class="experience">
    <canvas class="bg" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <canvas class="outline" aria-hidden="true"></canvas>

    <img class="logo" src="logo.webp" alt="ianisgfx" width="1600" height="1029">
    <div class="count" aria-live="polite"><b>0</b><i>%</i></div>

    <header class="header chrome">
      <nav class="nav" aria-label="Navigare"><a class="active" href="#">Despre</a><a href="#">Servicii</a><a href="#">Lucrări</a></nav>
      <a class="cta" href="#">Contact</a>
    </header>
    <aside class="list chrome" aria-label="Servicii"></aside>

    <section class="portal-wrap chrome" aria-label="Următorul serviciu">
      <div class="portal-heading"><span>Următorul:</span><span><span id="next-number">[02]</span><strong id="next-name">Webdesign</strong></span></div>
      <button class="portal" id="portal" type="button" aria-label="Mergi la Webdesign"></button>
    </section>

    <section class="content chrome" aria-live="polite">
      <h1 id="title">Branding</h1>
      <dl id="facts"></dl>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="bg.js"></script>
  <script>
    // Fiecare serviciu are „lumea” lui: alt zoom și altă nuanță a lichidului (textele sunt provizorii)
    const S = [
      { name: "Branding", z: 1.4, filter: "hue-rotate(0deg) saturate(1) brightness(1)", facts: [
        ["Ce primești:", "Logo, paletă de culori, tipografie și ghid de brand."], ["Durată:", "2–4 săptămâni."],
        ["Livrabile:", "Fișiere vector, PNG și ghidul de brand în PDF."], ["Pentru:", "Branduri noi sau care vor o identitate refăcută."]] },
      { name: "Webdesign", z: 0.85, filter: "hue-rotate(-14deg) saturate(1.3) brightness(1.05)", facts: [
        ["Ce primești:", "Site modern, rapid și responsive."], ["Durată:", "3–6 săptămâni."],
        ["Livrabile:", "Design, implementare și publicare online."], ["Pentru:", "Afaceri care vor să convertească vizitatori în clienți."]] },
      { name: "Social", z: 2.2, filter: "hue-rotate(8deg) saturate(1.1) brightness(1.25)", facts: [
        ["Ce primești:", "Postări, story-uri și template-uri pe brand."], ["Durată:", "Lunar sau pe campanie."],
        ["Livrabile:", "Fișiere gata de postat pe fiecare platformă."], ["Pentru:", "Conturi care vor să arate coerent și profesionist."]] },
      { name: "UI / UX", z: 1.1, filter: "hue-rotate(-6deg) saturate(.8) brightness(1.2)", facts: [
        ["Ce primești:", "Interfețe clare pentru aplicații și platforme."], ["Durată:", "2–5 săptămâni."],
        ["Livrabile:", "Prototip interactiv și fișiere Figma."], ["Pentru:", "Produse digitale ușor de folosit."]] },
      { name: "Print", z: 1.8, filter: "hue-rotate(12deg) saturate(1.4) brightness(.95)", facts: [
        ["Ce primești:", "Afișe, flyere, ambalaje și cărți de vizită."], ["Durată:", "1–2 săptămâni."],
        ["Livrabile:", "Fișiere pregătite pentru tipografie."], ["Pentru:", "Materiale care atrag privirea în lumea reală."]] },
    ];
    const $ = (s) => document.querySelector(s);
    const X = $(".experience"), veil = $(".veil"), portal = $("#portal"), list = $(".list"), title = $("#title");
    const bgCv = $(".bg"), line = $(".outline"), lx = line.getContext("2d");
    const retrigger = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
    let cur = 0, busy = false;

    const fitTitle = () => {
      title.style.fontSize = "";
      const box = $(".content"), avail = innerWidth > 640 ? box.clientWidth - $("#facts").offsetWidth - 40 : box.clientWidth;
      if (title.offsetWidth > avail) title.style.fontSize = parseFloat(getComputedStyle(title).fontSize) * (avail / title.offsetWidth) + "px";
    };
    const render = (first) => {
      const s = S[cur], ni = (cur + 1) % S.length;
      title.textContent = s.name;
      $("#facts").innerHTML = s.facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
      $("#next-number").textContent = `[${String(ni + 1).padStart(2, "0")}]`;
      $("#next-name").textContent = S[ni].name;
      portal.setAttribute("aria-label", `Mergi la ${S[ni].name}`);
      list.innerHTML = S.map((p, i) => `<span class="item${i === cur ? " active" : ""}">${p.name}</span>`).join("");
      if (!first) retrigger(list, "is-switching");
      fitTitle();
    };

    // Fereastra: dreptunghi rotunjit proiectat cu perspectivă falsă; înclinarea urmărește mouse-ul.
    // Lichidul din spate rămâne fix pe ecran, deci fereastra se mișcă peste o imagine care stă pe loc.
    const st = { e: 0, m: 0, veil: 0.55 };
    let rotX = 0, rotY = 0, tX = 0, tY = 0, last = performance.now();
    addEventListener("pointermove", (e) => {
      if (busy) return;
      tY = (e.clientX / innerWidth - 0.5) * 37.4;
      tX = (e.clientY / innerHeight - 0.5) * -33;
    });
    document.addEventListener("pointerleave", () => (tX = tY = 0));
    const rrect = (w, h, r) => {
      r = Math.min(r, w / 2, h / 2);
      const pts = [];
      for (const [x, y, a0, a1] of [[w / 2 - r, -h / 2 + r, -Math.PI / 2, 0], [w / 2 - r, h / 2 - r, 0, Math.PI / 2],
                                    [-w / 2 + r, h / 2 - r, Math.PI / 2, Math.PI], [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5]])
        for (let i = 0; i <= 10; i++) { const a = a0 + (a1 - a0) * i / 10; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }
      return pts;
    };
    const sizeLine = () => {
      const d = Math.min(devicePixelRatio || 1, 2);
      line.width = innerWidth * d; line.height = innerHeight * d;
      lx.setTransform(d, 0, 0, d, 0, 0);
    };
    const frame = (now) => {
      requestAnimationFrame(frame);
      const dt = Math.min(now - last, 40); last = now;
      rotX += (tX - rotX) * Math.min(1, dt * 0.009);
      rotY += (tY - rotY) * Math.min(1, dt * 0.009);
      const W = innerWidth, H = innerHeight, R = portal.getBoundingClientRect(), e = st.e;
      const rcx = R.left + R.width / 2, rcy = R.top + R.height / 2;
      const cx = rcx + (W / 2 - rcx) * e, cy = rcy + (H / 2 - rcy) * e;
      const sc = e ? 1 : st.m;
      const w = (R.width + (W - R.width) * e) * sc, h = (R.height + (H - R.height) * e) * sc;
      const ax = rotX * (1 - e) * Math.PI / 180, ay = rotY * (1 - e) * Math.PI / 180;
      const pts = rrect(w, h, 90 * (1 - e) * sc).map(([x, y]) => {
        const z = x * Math.sin(ay) - y * Math.sin(ax), p = 850 / (850 + z);
        return [cx + x * Math.cos(ay) * p, cy + y * Math.cos(ax) * p];
      });
      const d = "M" + pts.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join("L") + "Z";
      veil.style.clipPath = w > 1 && h > 1 ? `path(evenodd, "M0 0H${W}V${H}H0Z${d}")` : "none";
      veil.style.opacity = st.veil;
      // contur fin roșu pe marginea ferestrei
      lx.clearRect(0, 0, W, H);
      if (w > 1 && e < 1) {
        lx.beginPath(); pts.forEach(([x, y], i) => (i ? lx.lineTo(x, y) : lx.moveTo(x, y))); lx.closePath();
        lx.strokeStyle = `rgba(255, 79, 69, ${0.55 * (1 - e)})`; lx.lineWidth = 1; lx.stroke();
      }
    };

    const revealMask = () => { retrigger(X, "mask-revealing"); st.m = 0; return gsap.to(st, { m: 1, duration: 1.05, ease: "power3.inOut" }); };
    const revealContent = () => retrigger(X, "content-revealing");

    // Călătoria: fereastra înghite ecranul, lichidul își schimbă lumea, apoi se deschide un portal nou
    const travel = async () => {
      if (busy) return;
      busy = true; tX = tY = 0;
      X.classList.remove("content-revealing", "mask-revealing");
      X.classList.add("is-transitioning");
      await gsap.timeline()
        .to(st, { e: 1, duration: 1.1, ease: "power3.inOut" })
        .to(st, { veil: 0, duration: 0.6, ease: "power2.in" }, 0.5)
        .to(bg, { k: 1.7, duration: 0.9, ease: "power2.in" }, 0.2);
      cur = (cur + 1) % S.length;
      await gsap.timeline()
        .to(bg, { z: S[cur].z, k: 0.95, duration: 1.1, ease: "expo.out" })
        .to(bgCv, { filter: S[cur].filter, duration: 1.1, ease: "power2.out" }, 0);
      render();
      st.e = 0;
      X.classList.remove("is-transitioning");
      gsap.to(st, { veil: 0.86, duration: 1.05, ease: "power2.inOut" });
      setTimeout(revealContent, 100);
      await revealMask();
      busy = false;
    };
    portal.addEventListener("click", travel);

    // Preloader ~3s: lichidul se aprinde sub voal, contorul urcă la 100%, apoi logo-ul zboară în header
    const count = $(".count"), cnt = { v: 0 };
    const finish = () => {
      count.classList.add("is-leaving");
      $(".logo").classList.add("is-docked");
      document.body.classList.add("intro-ready");
      gsap.to(st, { veil: 0.86, duration: 1.2, ease: "power2.inOut" });
      revealMask();
      setTimeout(revealContent, 850);
      setTimeout(() => count.remove(), 750);
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) gsap.globalTimeline.timeScale(20); // fără animații lungi
    sizeLine(); addEventListener("resize", () => { sizeLine(); fitTitle(); });
    render(true);
    requestAnimationFrame(frame);
    document.fonts.ready.then(fitTitle);
    gsap.timeline()
      .to(bg, { k: 0.95, z: S[0].z, duration: 3, ease: "power2.out" }, 0)
      .to(cnt, { v: 100, duration: 3, ease: "power1.inOut", onUpdate: () => (count.firstChild.textContent = Math.round(cnt.v)) }, 0)
      .add(finish);
  </script>
</body>
</html>
